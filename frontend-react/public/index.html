<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="Hate Speech Detection Social Media - Detect and report harmful content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HateSpeech Detector" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231976d2' width='180' height='180'/><text x='50%' y='50%' font-size='120' fill='white' text-anchor='middle' dy='.3em' font-weight='bold'>HS</text></svg>" />
    <title>Social Feed - Hate Speech Detection</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then((registration) => {
            console.log('ServiceWorker registered:', registration);
          }).catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
